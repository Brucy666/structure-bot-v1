# =============================
# StructureBot v2 — Config
# =============================

symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
timeframes: ["1m", "5m"]

lookback_bars: 600
poll_seconds: 45

# =============================
# Risk / trade plan
# =============================
risk:
  retest_offset_pct: "auto"   # dynamic offset (5–25% of zone width, scaled by ATR)
  stop_atr_mult: 0.8          # ATR pad beyond opposite zone edge (more robust than 0.25)
  tp_rr: 1.6                  # first target in R

# =============================
# Signal detection
# =============================
impulse:
  atr_len: 14
  body_min: 0.5
  atr_mult: 1.0
  min_consecutive: 1

zones:
  max_zone_pct: 0.50

signals:
  confirm_closes: 1
  sfp_window: 3

# =============================
# Scoring system
# =============================
scoring:
  min_score_to_alert: 90
  tf_overrides:
    "1m": 92
    "5m": 90
  w_zone_strength: 0.35
  w_signal_clean: 0.35
  w_regime: 0.20
  w_bias: 0.10

# =============================
# Filters (HARD)
# =============================
filters:
  use_htf_bias: true
  htf_timeframe: "15m"

  # Require ATR to be above the 40th percentile of last 200 bars
  min_atr_percentile: 40

  # Per-symbol/timeframe allow-lists for types and hours (UTC)
  allowed:
    BTC/USDT:
      "1m":
        types: ["BOS"]                      # BTC/1m SFP was weak; start BOS-only
        hours_utc: [0,1,5,6,10,11,22,23]
      "5m":
        types: ["BOS","SFP"]
        hours_utc: [0,1,5,6,10,11,14,15,22,23]
    ETH/USDT:
      "1m":
        types: ["BOS","SFP"]
        hours_utc: [0,1,4,5,7,11,14,19,22,23]
      "5m":
        types: ["BOS","SFP"]
        hours_utc: [0,1,4,5,7,11,14,19,22,23]
    SOL/USDT:
      "1m":
        types: ["BOS","SFP"]
        hours_utc: [0,1,5,7,9,15,16,17,19,22,23]
      "5m":
        types: ["BOS","SFP"]
        hours_utc: [0,1,5,7,9,15,16,17,19,22,23]

# =============================
# Regime (enforced)
# =============================
regime:
  atr_ma_len: 50
  trend_ratio_min: 1.5       # BOS->trending, SFP->ranging

# =============================
# Startup backfill (first boot only)
# =============================
startup_backfill:
  enabled: true
  lookback_bars: 250
  max_signals_per_market: 5

# =============================
# Debug / logging
# =============================
debug:
  log_scans: true
  log_zones: false
  heartbeat_minutes: 2

# =============================
# Supabase
# =============================
supabase:
  signals_table: "signals"

# =============================
# Discord
# =============================
discord_webhook_url: ${DISCORD_WEBHOOK_URL}

# =============================
# Research mode
# =============================
research:
  exchange: binance
  symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
  timeframes: ["1m"]
  days: 30
  min_score: 90
  cache_dir: "cache"
  push_to_supabase: true
  save_csv: true
  signals_table: "signals"

# =============================
# Outcomes worker (live/optional)
# =============================
outcomes:
  tf_for_check: "1m"
  max_age_hours: 8
  miss_after_hours: 2
  poll_seconds: 60
  post_to_discord: false

# =============================
# StructureBot Config
# =============================

symbols:
  - "BTC/USDT"
  - "ETH/USDT"
  - "SOL/USDT"

timeframes:
  - "1m"
  - "5m"

lookback_bars: 500
poll_seconds: 30

# =============================
# Risk / trade plan
# =============================
risk:
  retest_offset_pct: 0.1     # entry offset into zone
  stop_atr_mult: 0.8         # stop size relative to ATR
  tp_rr: 1.6                 # TP1 RR multiple

# =============================
# Signal detection
# =============================
impulse:
  atr_len: 14
  body_min: 0.5
  atr_mult: 1.0
  min_consecutive: 1

zones:
  max_zone_pct: 0.5          # max % of impulse size for zone thickness

signals:
  confirm_closes: 1          # closes needed beyond zone for BOS
  sfp_window: 3              # lookback bars for SFP

# =============================
# Scoring system
# =============================
scoring:
  min_score_to_alert: 70
  tf_overrides:
    "1m": 70
    "5m": 75
  w_zone_strength: 0.4
  w_signal_clean: 0.3
  w_regime: 0.2
  w_bias: 0.1

# =============================
# Filters
# =============================
filters:
  use_htf_bias: true
  htf_timeframe: "15m"

# =============================
# Regime detection
# =============================
regime:
  atr_ma_len: 50
  trend_ratio_min: 1.5

# =============================
# Startup backfill
# =============================
startup_backfill:
  enabled: true
  lookback_bars: 200
  max_signals_per_market: 5

# =============================
# Debug / logging
# =============================
debug:
  log_scans: true
  log_zones: true
  heartbeat_minutes: 2

# =============================
# Supabase
# =============================
supabase:
  signals_table: "signals"

# =============================
# Discord
# =============================
discord_webhook_url: ${DISCORD_WEBHOOK_URL}

# =============================
# Research mode
# =============================
research:
  exchange: binance
  symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
  timeframes: ["1m"]
  days: 30
  min_score: 70
  cache_dir: "cache"
  push_to_supabase: true
  save_csv: true
  signals_table: "signals"
